{{- if .Values.enabled }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "Moonin-Node-Agent.serviceAccountName" . }}
  labels:
    {{- include "Moonin-Node-Agent.labels" . | nindent 4 }}
  annotations:
    {{- include "Moonin-Node-Agent.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- end }}
